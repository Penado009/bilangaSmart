<!DOCTYPE html>
<html lang="ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="shortcut icon" href="../../icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./../../css/style_home/principal.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
    <link rel="stylesheet" href="../../css/style_carrinho/carrinho.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>
        <div id="logo">
            <a href="../../index.html">
                <img src="../../icon/logo.png" alt="logo" class="logo-img">
            </a>
        </div>

        <div class="menu-hambur" id="hambur">
            <img src="../../icon/menu_humburguim.png" alt="Menu para dispositivos móveis" >
        </div>

        <nav class="navbar">
            <a href="../../index.html" >Home</a>
            <a href="../produtos/produtos.html">Produtos</a>
            
            
            <div class="link_categoria">
                <a href="#" class="">Categórias
                    
                </a>
                <nav class="nav_subCat ">
                    <a href="#categoria">Horticulas</a>
                    <a href="#categoria">Vegetais</a>
                    <a href="#categoria">Frutos</a>
                    <a href="#categoria">Tubercules</a>
                </nav>
            </div>
            
            <a href="../sobre/sobre.html">Sobre Nós</a>
        </nav>
        <a href="#" class="cart-icon" >
            🛒 <span class="cart-count" id="count">0</span>
        </a>
    </header>

    <aside class="menu-movel">
        <span class="close-cart" >✖</span>
        <nav class="nav-movel">
            
                <a href="../../index.html" >Home</a>
                <a href="../produtos/produtos.html">Produtos</a>
                <a href="#">Categórias</a>
                <a href="../sobre/sobre.html">Sobre Nós</a>
            
        </nav>
    </aside>

    <main>
        <section class="main_carrinho">
            

            <form action="" id="iform_finalizar"  class="form_finalizar">
                <h2>Formulário de Compra</h2>
                
                <fieldset style="flex-flow: column nowrap;">
                    <legend>Dados Pessoas</legend>
                    <div class="nome_final">
                        <input type="text" name="nome" id="inome" placeholder="Digite o nome" >
                    </div>
                
                    <div class="email_final">
                        <input type="email" name="email" id="i-email" placeholder="Digite o email" >
                    </div>
                
                    <div class="tel_final">
                        <input type="tel" name="telef" id="itelef" placeholder="Digite o número "  >
                    </div>
                </fieldset>

                <fieldset class="localizacao" >
                   <legend>Endereço</legend>

                    <select name="municipio" id="imunicipio" >
                        
                            <option value="" >Selecione o município</option>
                            <option value="Ingo">Ingombota</option>
                            <option value="Samb">Sambizanga</option>
                            <option value="Rang">Rangel</option>
                            <option value="Mai">Maianga</option>
                            <option value="Sa">Samba</option>
                            <option value="Tala">Talatona</option>
                            <option value="Muss">Mussulo</option>
                            <option value="Be">Belas</option>
                            <option value="Ki">Kilamba</option>
                            <option value="Cam">Camama</option>
                            <option value="Via">Viana</option>
                            <option value="Mul">Mulenvos</option>
                            <option value="Cac">Cacuaco</option>
                            <option value="Caz">Cazenga</option>
                            <option value="Hoji">Hoji ya Henda</option>
                            <option value="K. Kiax">Kilamba Kiaxi</option>
                            
                        
                    </select>

                    <div class="bairro_final" style="width: 50%;" >
                        <input type="text"  name="bairro" id="ibairro" placeholder="Bairro">
                    </div>

                    
                </fieldset>

                
                   <button onclick="finalizarPedido()" type="submit" class="btn-checkout" >FINALIZAR</button>
                
                
            </form>

            
            
            <div id="cart-sidebar" >
            
                <h2 style="border-bottom: 2px solid #eee;">O Meu Pedido</h2>
                <div class="cont_itemsList" style="overflow-y: auto;">
                    <div class="cart-items" id="cart-list" >
                        <div class="cart-empty">Carrinho vazio</div>
                    </div>
                </div>
                <div style="border-top: 2px solid #eee; padding-top: 15px;">
                    <h4>Total: <span id="total-price">0</span> Kz</h4>
                    <!-- <button type="button" class="btn-checkout" onclick="finalizeOrder()" id="btn-finalize" style="display: none; width: 100%; margin-top: 10px;">ENVIAR PEDIDO VIA WHATSAPP</button> -->
                    <button type="button" onclick="clearCartItems()" style="width: 100%; margin-top: 10px; background-color: #f44336; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer;">Limpar Carrinho</button>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="../../script/cart.js"></script>
    <script type="module" src="../../script/main.js"></script>
    <script type="module" src="../../script/prodScript.js"></script>
    <script type="module" src="../../script/cart-page.js"></script>

    <footer>
            <div class="container_footer">
                <div>
                    
                    <div class="redes_sociais flex_footer">
                        <div class="item-rede"></div>
                        <div class="item-rede"></div>
                        <div class="item-rede"></div>
                        <div class="item-rede"></div>
                    </div>
                </div>
                <div class="links">
                   
                
                        <nav class="link_footer flex_footer " style="align-items: start;">
                            <a href="#" onclick="location.reload()">Home</a>
                            <a href="sec_page/produtos/produtos.html">Produtos</a>
                            <a href="#">Categórias</a>
                            <a href="#">Sobre Nós</a>
                        </nav>
                </div>

                <div class="coment-footer flex_footer">
                    <input type="text" name="user" id="iuser" class="none_outline radius-coment" style="opacity: .8;" placeholder="Nome">
                    <textarea name="depoimento none_outline" id="idepoimento" class="none_outline" placeholder="Comenta...">

                    </textarea>

                    <input type="button" class="radius-coment btn-comentar " value="Comentar">
                </div>

            </div>
            <hr style="margin: 10px;">
            <div class="right " style="text-align: center; font-style: italic; cursor: pointer;">&copy;BakongoInstic 2026</div>
            
        </footer>
</body>
</html>
