<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="./../../css/style_home/principal.css">
    <link rel="stylesheet" href="./../../css/style_produtos/main.css">
</head>
<body style="background-color: #FFF;">
    <header>
        <div id="logo">
            <img src="/icon/logo.png" alt="logo" style="width: 100px; height: 50px; margin: 0; padding: 0; cursor: pointer;">
        </div>
        
        <nav class="navbar">
            <a href="/index.html" onclick="location.reload()">Home</a>
            <a href="produtos.html" >Produtos</a>
            <a href="#">Categórias</a>
            <a href="#">Sobre Nós</a>
        </nav>
        <a href="./../carrinho/carrinho.html" class="cart-icon" >
            🛒 <span class="cart-count" id="count">0</span>
        </a>
    </header>

    <main id="shop-area">
        <div class="container">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Pesquisar produtos (ex: Banana, Cenoura...)"
                    onkeyup="filterProducts()">
            </div>

    
            <h2 style="margin-bottom: 30px;">Todos os nossos produtos</h2>


            <div class="product-grid">
                
            </div>
    </main>

    <script src="./../../script/cart.js" ></script>
    <script src="./../../script/main.js" type="module"></script>
    <script src="../../script/prodScript.js" type="module"></script>

    <footer>
            <div class="container_footer" style="display: flex; justify-content: space-around;">

                <div>
                    
                    <div class="redes_sociais flex_footer">
                        <div class="item-rede"></div>
                        <div class="item-rede"></div>
                        <div class="item-rede"></div>
                        <div class="item-rede"></div>
                    </div>
                </div>
                <div class="links">
                   
                
                        <nav class="link_footer flex_footer " style="align-items: start;">
                            <a href="#" onclick="location.reload()">Home</a>
                            <a href="sec_page/produtos/produtos.html">Produtos</a>
                            <a href="#">Categórias</a>
                            <a href="#">Sobre Nós</a>
                        </nav>
                </div>

                <div class="coment-footer flex_footer">
                    <input type="text" name="user" id="iuser" class="none_outline radius-coment" style="opacity: .8;" placeholder="Nome">
                    <textarea name="depoimento none_outline" id="idepoimento" class="none_outline" placeholder="Comenta...">

                    </textarea>

                    <input type="button" class="radius-coment btn-comentar " value="Comentar">
                </div>

            </div>
            <hr style="margin: 10px;">
            <div class="right " style="text-align: center; font-style: italic; cursor: pointer;">&copy;BakongoInstic 2026</div>
            
        </footer>
</body>
</html>
